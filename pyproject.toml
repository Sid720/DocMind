[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docmind-rag"
version = "1.0.0"
description = "Source-grounded multi-document RAG with FAISS, Chroma, Hugging Face embeddings, and Streamlit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.36,<2",
  "langchain>=0.3,<0.4",
  "langchain-community>=0.3,<0.4",
  "langchain-text-splitters>=0.3,<0.4",
  "langchain-huggingface>=0.1,<0.2",
  "langchain-chroma>=0.2,<0.3",
  "faiss-cpu>=1.8,<2",
  "chromadb>=0.5,<1",
  "sentence-transformers>=3,<4",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "docx2txt>=0.8,<1",
  "python-dotenv>=1,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
